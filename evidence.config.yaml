deployment:
  # The site will be served at kennanmasters.com/ranch-demo/, so every URL needs this prefix.
  basePath: /ranch-demo

appearance:
  # Light only, to match the portfolio (which has no dark mode).
  default: light
  switcher: false

theme:
  colorPalettes:
    default:
      # Chart colors: earthy like the portfolio, but more saturated than its page colors so
      # chart lines stay distinct (checked with the dataviz palette validator on #faf9f4).
      # Only these four are validated; a chart needing more series should fold them into "Other".
      light:
        - "#2f7d3c"
        - "#e8843e"
        - "#3f8fc4"
        - "#8f3d56"
      dark:
        - "#236aa4"
        - "#45a1bf"
        - "#a5cdee"
        - "#8dacbf"
        - "#85c7c6"
        - "#d2c6ac"
        - "#f4b548"
        - "#8f3d56"
        - "#71b9f4"
        - "#46a485"
  colorScales:
    default:
      light:
        - "#cfe3cf"
        - "#17432a"
      dark:
        - "#ADD8E6"
        - "#00008B"
  colors:
    # Page colors from the portfolio stylesheet (styles.css): leather, rust, cream, soil, bark.
    primary:
      light: "#3d6642"
      dark: "#3b82f6"
    accent:
      light: "#e8843e"
      dark: "#fdba74"
    base:
      light: "#faf9f4"
      dark: "#09090b"
    base-heading:
      light: "#1c2e1f"
    base-content:
      light: "#2e4d31"
    info:
      light: "#0284c7"
      dark: "#38bdf8"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # You can add additional datasources here by adding npm packages. 
    # Make to also add them to `package.json`.
    "@evidence-dev/bigquery": { }
    "@evidence-dev/csv": { }
    "@evidence-dev/databricks": { }
    "@evidence-dev/duckdb": { }
    "@evidence-dev/mssql": { }
    "@evidence-dev/mysql": { }
    "@evidence-dev/postgres": { }
    "@evidence-dev/source-javascript": { }
    "@evidence-dev/snowflake": { }
    "@evidence-dev/sqlite": { }
    "@evidence-dev/trino": { }
    "@evidence-dev/motherduck": { }
