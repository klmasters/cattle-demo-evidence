name: Rebuild site when uploads change

# Every 15 minutes, look at a fingerprint of upload_batches (newest upload, batch count, voided
# count). If it differs from the one used for the last rebuild, ask Cloudflare to rebuild the
# site so the dashboards pick up the change. An upload, a batch voided by hand and the daily
# purge all change the fingerprint. GitHub may start scheduled runs late.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:      # "Run workflow" button

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint of upload_batches
        id: fp
        env:
          DATABASE_URL: ${{ secrets.PURGE_DB_URL }}   # ranch_purger can read upload_batches
        run: |
          fp=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "
            select coalesce(extract(epoch from max(uploaded_at))::bigint, 0)
                   || '-' || count(*) || '-' || count(*) filter (where voided)
              from ranch_demo.upload_batches")
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      # The cache key is the fingerprint. An exact hit means we already rebuilt for this state.
      - name: Was this state already built?
        id: seen
        uses: actions/cache@v4
        with:
          path: .fingerprint
          key: rebuilt-${{ steps.fp.outputs.fingerprint }}

      - name: Ask Cloudflare to rebuild
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
          FINGERPRINT: ${{ steps.fp.outputs.fingerprint }}
        run: |
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "$FINGERPRINT" > .fingerprint   # the cache is saved at the end if this job succeeds
